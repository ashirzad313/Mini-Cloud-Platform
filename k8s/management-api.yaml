# Least privilege: the Go API gets its own identity and may only list Pods
# in this namespace. It cannot create, delete, or modify workloads yet.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mini-cloud-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mini-cloud-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mini-cloud-pod-reader
subjects:
  - kind: ServiceAccount
    name: mini-cloud-api
    namespace: default
roleRef:
  kind: Role
  name: mini-cloud-pod-reader
  apiGroup: rbac.authorization.k8s.io
---
# Kubernetes runs and maintains one copy of our Go Management API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-cloud-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mini-cloud-api
  template:
    metadata:
      labels:
        app: mini-cloud-api
    spec:
      serviceAccountName: mini-cloud-api
      containers:
        - name: api
          image: mini-cloud-api:v0.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # 'postgres' resolves to the PostgreSQL Service inside Kubernetes.
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: mini_cloud
            - name: PGDATABASE
              value: mini_cloud
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            # Suitable for this local kind demo; use TLS in a real deployment.
            - name: PGSSLMODE
              value: disable
---
# Gives other Pods a stable name to reach the API.
apiVersion: v1
kind: Service
metadata:
  name: mini-cloud-api
spec:
  type: ClusterIP
  selector:
    app: mini-cloud-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
