# Kubernetes runs and maintains one copy of our Go Management API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-cloud-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mini-cloud-api
  template:
    metadata:
      labels:
        app: mini-cloud-api
    spec:
      containers:
        - name: api
          image: mini-cloud-api:v0.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # 'postgres' resolves to the PostgreSQL Service inside Kubernetes.
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: mini_cloud
            - name: PGDATABASE
              value: mini_cloud
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            # Suitable for this local kind demo; use TLS in a real deployment.
            - name: PGSSLMODE
              value: disable
---
# Gives other Pods a stable name to reach the API.
apiVersion: v1
kind: Service
metadata:
  name: mini-cloud-api
spec:
  type: ClusterIP
  selector:
    app: mini-cloud-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
